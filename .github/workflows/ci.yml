# Execute all notebooks on CPU (small mode) to make sure they keep running with the pinned environment
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 1 * *'  # monthly, to catch upstream breakage
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: binder/environment.yml
          create-args: nbconvert ipykernel
          cache-environment: true

      - name: Cache phantom
        uses: actions/cache@v4
        with:
          path: data/M_sim_1.0e+01.h5
          key: phantom-M_sim_1.0e+01

      - name: Execute notebooks
        working-directory: notebooks
        env:
          ALGF_SMALL: '1'
        run: |
          for notebook in 0*.ipynb; do
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1800 --output-dir /tmp "$notebook"
          done
